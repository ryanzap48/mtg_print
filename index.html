<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The stylesheet declares `color-scheme: light`; saying "light dark" here would let the
         browser render form controls and scrollbars dark on a page that has no dark theme. -->
    <meta name="color-scheme" content="light" />
    <!-- Matches the nav bar, which is what sits under Safari's toolbar at the top of the page. -->
    <meta name="theme-color" content="#1c1917" />
    <link rel="preconnect" href="https://cards.scryfall.io" crossorigin />
    <link rel="preconnect" href="https://api.scryfall.com" crossorigin />
    <link rel="dns-prefetch" href="https://cards.scryfall.io" />

    <!-- Real icon files rather than an inline data URI. Safari's start page, iOS home screen and
         Android all ignore a data-URI favicon and fall back to a grey letter tile. Sources live
         in `icons/`; run `npm run icons` to regenerate. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="MTG Print" />
    <!--seo:start-->
    <!-- Defaults for `npm run dev` only. At build time scripts/prerender.mjs replaces
         everything between these two markers with the real per-route metadata, including the
         absolute canonical and og:url that need SITE_URL to exist. Editing tags here without
         also teaching that script about them will have no effect on what ships. -->
    <title>MTG Print Proxy | print Magic proxies at true card size</title>
    <meta
      name="description"
      content="Paste a Magic: The Gathering decklist and download a print-ready PDF, 9 cards per page at true 63x88mm size. Pick any printing, free, runs entirely in your browser."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MTG Print Proxy" />
    <meta property="og:title" content="MTG Print Proxy" />
    <meta
      property="og:description"
      content="Paste a Magic: The Gathering decklist and download a print-ready PDF, 9 cards per page at true 63x88mm size."
    />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--seo:end-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
